<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1180" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1500" height="1180" fill="#ffffff" />
  <text x="750" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">SIP Management System — Entity-Relationship Diagram</text>

  <g transform="translate(0,40)">

  <!-- ================= EDGES (drawn first, under boxes) ================= -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <!-- User -> User_Phone -->
    <line x1="640" y1="150" x2="230" y2="255" />
    <!-- User -> Bank_Account -->
    <line x1="700" y1="150" x2="510" y2="255" />
    <!-- User -> Goal -->
    <line x1="790" y1="150" x2="790" y2="255" />
    <!-- User -> Goal_Member -->
    <line x1="850" y1="150" x2="1080" y2="255" />
    <!-- Goal -> Goal_Member -->
    <line x1="900" y1="315" x2="1010" y2="315" />
    <!-- User -> SIP_Plan -->
    <line x1="760" y1="150" x2="760" y2="465" />
    <!-- Stock -> SIP_Plan -->
    <line x1="340" y1="500" x2="640" y2="500" />
    <!-- Goal -> SIP_Plan (optional FK) -->
    <line x1="770" y1="350" x2="770" y2="465" stroke-dasharray="6,5" />
    <!-- SIP_Plan -> Installments -->
    <line x1="760" y1="620" x2="760" y2="685" />
    <!-- SIP_Plan -> SIP_Transaction -->
    <line x1="895" y1="595" x2="895" y2="885" />
    <!-- Installments -> SIP_Transaction -->
    <line x1="760" y1="815" x2="760" y2="885" />
    <!-- Bank_Account -> SIP_Transaction -->
    <line x1="470" y1="355" x2="640" y2="920" />
  </g>

  <!-- Cardinality labels -->
  <g font-size="14" fill="#334155" font-weight="bold">
    <text x="410" y="215">1</text><text x="255" y="248">*</text>
    <text x="660" y="215">1</text><text x="530" y="248">*</text>
    <text x="800" y="200">1</text><text x="800" y="248">*</text>
    <text x="900" y="215">1</text><text x="1055" y="248">*</text>
    <text x="915" y="308">1</text><text x="1005" y="308">*</text>
    <text x="745" y="300">1</text><text x="745" y="460">*</text>
    <text x="360" y="493">1</text><text x="615" y="493">*</text>
    <text x="778" y="400">1</text><text x="778" y="460">0..*</text>
    <text x="745" y="655">1</text><text x="745" y="682">*</text>
    <text x="905" y="640">1</text><text x="905" y="880">1</text>
    <text x="745" y="850">1</text><text x="745" y="882">1</text>
    <text x="486" y="380">1</text><text x="600" y="895">*</text>
  </g>

  <!-- ================= ENTITY BOXES ================= -->
  <!-- User -->
  <g>
    <rect x="620" y="20" width="260" height="130" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="620" y="20" width="260" height="30" rx="8" fill="#4f46e5"/>
    <rect x="620" y="40" width="260" height="10" fill="#4f46e5"/>
    <text x="750" y="40" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">User</text>
    <text x="632" y="70" font-size="12" fill="#0f172a">PK  User_ID</text>
    <text x="632" y="88" font-size="12" fill="#334155">First_Name, Last_Name</text>
    <text x="632" y="104" font-size="12" fill="#334155">UK  Email_ID, Pan_Number</text>
    <text x="632" y="120" font-size="12" fill="#334155">DOB, Password</text>
    <text x="632" y="136" font-size="12" fill="#334155">Created_At</text>
  </g>

  <!-- User_Phone -->
  <g>
    <rect x="100" y="255" width="240" height="100" rx="8" fill="#f8fafc" stroke="#4f46e5" stroke-width="2"/>
    <rect x="100" y="255" width="240" height="28" rx="8" fill="#4f46e5"/>
    <rect x="100" y="273" width="240" height="10" fill="#4f46e5"/>
    <text x="220" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">User_Phone</text>
    <text x="112" y="303" font-size="12" fill="#0f172a">PK  Phone_ID</text>
    <text x="112" y="320" font-size="12" fill="#334155">FK  User_ID</text>
    <text x="112" y="337" font-size="12" fill="#334155">Phone_Number, Is_Verified</text>
  </g>

  <!-- Bank_Account -->
  <g>
    <rect x="380" y="255" width="240" height="100" rx="8" fill="#f8fafc" stroke="#4f46e5" stroke-width="2"/>
    <rect x="380" y="255" width="240" height="28" rx="8" fill="#4f46e5"/>
    <rect x="380" y="273" width="240" height="10" fill="#4f46e5"/>
    <text x="500" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Bank_Account</text>
    <text x="392" y="303" font-size="12" fill="#0f172a">PK  Account_ID</text>
    <text x="392" y="320" font-size="12" fill="#334155">FK  User_ID</text>
    <text x="392" y="337" font-size="12" fill="#334155">Account_No, Bank_Name, IFSC_Code</text>
  </g>

  <!-- Goal -->
  <g>
    <rect x="660" y="255" width="240" height="120" rx="8" fill="#fdf4ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="660" y="255" width="240" height="28" rx="8" fill="#7c3aed"/>
    <rect x="660" y="273" width="240" height="10" fill="#7c3aed"/>
    <text x="780" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Goal</text>
    <text x="672" y="303" font-size="12" fill="#0f172a">PK  Goal_ID</text>
    <text x="672" y="320" font-size="12" fill="#334155">FK  User_ID (owner)</text>
    <text x="672" y="337" font-size="12" fill="#334155">Goal_Name, Target_Amount</text>
    <text x="672" y="354" font-size="12" fill="#334155">Target_Date, Status, UK Invite_Code</text>
  </g>

  <!-- Goal_Member -->
  <g>
    <rect x="1010" y="255" width="240" height="100" rx="8" fill="#fdf4ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="1010" y="255" width="240" height="28" rx="8" fill="#7c3aed"/>
    <rect x="1010" y="273" width="240" height="10" fill="#7c3aed"/>
    <text x="1130" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Goal_Member</text>
    <text x="1022" y="303" font-size="12" fill="#0f172a">PK  Goal_Member_ID</text>
    <text x="1022" y="320" font-size="12" fill="#334155">FK  Goal_ID, FK User_ID</text>
    <text x="1022" y="337" font-size="12" fill="#334155">Joined_At  (UK: Goal_ID+User_ID)</text>
  </g>

  <!-- Stock -->
  <g>
    <rect x="100" y="440" width="240" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect x="100" y="440" width="240" height="28" rx="8" fill="#16a34a"/>
    <rect x="100" y="458" width="240" height="10" fill="#16a34a"/>
    <text x="220" y="459" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Stock</text>
    <text x="112" y="488" font-size="12" fill="#0f172a">PK  Stock_ID</text>
    <text x="112" y="505" font-size="12" fill="#334155">Stock_Name, Sector</text>
    <text x="112" y="522" font-size="12" fill="#334155">UK  Ticker_Symbol, Risk_Level</text>
    <text x="112" y="539" font-size="12" fill="#334155">Current_Price, Last_Updated</text>
  </g>

  <!-- SIP_Plan -->
  <g>
    <rect x="640" y="465" width="260" height="155" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="640" y="465" width="260" height="28" rx="8" fill="#4f46e5"/>
    <rect x="640" y="483" width="260" height="10" fill="#4f46e5"/>
    <text x="770" y="484" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">SIP_Plan</text>
    <text x="652" y="513" font-size="12" fill="#0f172a">PK  SIP_ID</text>
    <text x="652" y="530" font-size="12" fill="#334155">FK  User_ID, FK Stock_ID</text>
    <text x="652" y="547" font-size="12" fill="#334155">FK  Goal_ID (nullable)</text>
    <text x="652" y="564" font-size="12" fill="#334155">Amount, Frequency, Start_Date</text>
    <text x="652" y="581" font-size="12" fill="#334155">Status, Round_Up_Enabled</text>
  </g>

  <!-- Installments -->
  <g>
    <rect x="640" y="685" width="260" height="130" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <rect x="640" y="685" width="260" height="28" rx="8" fill="#d97706"/>
    <rect x="640" y="703" width="260" height="10" fill="#d97706"/>
    <text x="770" y="704" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Installments</text>
    <text x="652" y="733" font-size="12" fill="#0f172a">PK  Inst_ID</text>
    <text x="652" y="750" font-size="12" fill="#334155">FK  SIP_ID</text>
    <text x="652" y="767" font-size="12" fill="#334155">Due_Date, Paid_Date, Amount</text>
    <text x="652" y="784" font-size="12" fill="#334155">Status (Pending/Paid/Overdue)</text>
  </g>

  <!-- SIP_Transaction -->
  <g>
    <rect x="620" y="885" width="300" height="150" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <rect x="620" y="885" width="300" height="28" rx="8" fill="#dc2626"/>
    <rect x="620" y="903" width="300" height="10" fill="#dc2626"/>
    <text x="770" y="904" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">SIP_Transaction</text>
    <text x="632" y="933" font-size="12" fill="#0f172a">PK  Transaction_ID</text>
    <text x="632" y="950" font-size="12" fill="#334155">FK  SIP_ID, FK Installment_ID</text>
    <text x="632" y="967" font-size="12" fill="#334155">FK  Account_ID</text>
    <text x="632" y="984" font-size="12" fill="#334155">Amount, Round_Up_Amount</text>
    <text x="632" y="1001" font-size="12" fill="#334155">Transaction_Date, Status</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#475569">
    <rect x="60" y="1060" width="16" height="16" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="82" y="1073">Core account tables</text>
    <rect x="260" y="1060" width="16" height="16" fill="#fdf4ff" stroke="#7c3aed"/>
    <text x="282" y="1073">Goals (shared savings)</text>
    <rect x="470" y="1060" width="16" height="16" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="492" y="1073">Reference data</text>
    <rect x="640" y="1060" width="16" height="16" fill="#fffbeb" stroke="#d97706"/>
    <text x="662" y="1073">Scheduling</text>
    <rect x="780" y="1060" width="16" height="16" fill="#fef2f2" stroke="#dc2626"/>
    <text x="802" y="1073">Money movement</text>
    <text x="60" y="1100" font-style="italic" fill="#64748b">Dashed line = optional (nullable) foreign key. PK = Primary Key, FK = Foreign Key, UK = Unique Key.</text>
  </g>

  </g>
</svg>
